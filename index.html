<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI基礎テスト</title>

  <style>
    body {
      font-family: sans-serif;
      max-width: 700px;
      margin: 0 auto;
      padding: 30px 20px;
      background: #f5f5f5;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
    }

    h1 {
      text-align: center;
    }

    #questionNumber {
      margin-top: 25px;
      color: #666;
    }

    .question {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.6;
      margin: 15px 0 25px;
    }

    .choice {
      display: block;
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: white;
      cursor: pointer;
      text-align: left;
      font-size: 16px;
    }

    .choice:hover {
      background: #f0f0f0;
    }

    .choice:disabled {
      cursor: default;
    }

    #result {
      margin-top: 25px;
      font-size: 18px;
      font-weight: bold;
    }

    #explanation {
      margin-top: 15px;
      padding: 15px;
      background: #f7f7f7;
      border-radius: 8px;
      line-height: 1.7;
      display: none;
    }

    #nextButton {
      display: none;
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #333;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>AI基礎テスト</h1>

    <div id="questionNumber"></div>

    <div id="question" class="question"></div>

    <div id="choices"></div>

    <div id="result"></div>

    <div id="explanation"></div>

    <button id="nextButton">次の問題</button>

  </div>

  <script>
    const questions = [
      {
        number: 1,
        text: "AIとは何でしょう？",
        choices: [
          "A. 人間の知的な活動の一部をコンピューターで実現する技術",
          "B. インターネット上の情報をすべて保存する技術",
          "C. コンピューターを人間の代わりにする技術",
          "D. ロボットだけを動かすための技術"
        ],
        answer: 0,
        explanation:
          "AIとは、人間が行う知的な活動の一部をコンピューターで実現する技術です。画像認識、音声認識、文章の理解や生成など、さまざまな分野で利用されています。"
      }
    ];

    let currentQuestion = 0;

    function showQuestion() {
      const question = questions[currentQuestion];

      document.getElementById("questionNumber").textContent =
        "第" + question.number + "問";

      document.getElementById("question").textContent =
        question.text;

      const choicesElement = document.getElementById("choices");
      choicesElement.innerHTML = "";

      document.getElementById("result").textContent = "";

      const explanationElement =
        document.getElementById("explanation");

      explanationElement.style.display = "none";
      explanationElement.textContent = "";

      document.getElementById("nextButton").style.display = "none";

      question.choices.forEach((choice, index) => {
        const button = document.createElement("button");

        button.textContent = choice;
        button.className = "choice";

        button.onclick = function() {
          answerQuestion(index);
        };

        choicesElement.appendChild(button);
      });
    }

    function answerQuestion(selectedAnswer) {
      const question = questions[currentQuestion];

      const buttons =
        document.querySelectorAll(".choice");

      buttons.forEach(button => {
        button.disabled = true;
      });

      const resultElement =
        document.getElementById("result");

      if (selectedAnswer === question.answer) {
        resultElement.textContent = "正解！🎉";
      } else {
        resultElement.textContent =
          "不正解！ 正解は " +
          question.choices[question.answer] +
          " です。";
      }

      const explanationElement =
        document.getElementById("explanation");

      explanationElement.textContent =
        "【解説】\n" + question.explanation;

      explanationElement.style.display = "block";

      document.getElementById("nextButton").style.display =
        "inline-block";
    }

    document.getElementById("nextButton").onclick =
      function() {

        if (currentQuestion < questions.length - 1) {
          currentQuestion++;
          showQuestion();
        } else {
          document.getElementById("questionNumber").textContent =
            "";

          document.getElementById("question").textContent =
            "テスト終了！";

          document.getElementById("choices").innerHTML = "";

          document.getElementById("result").textContent =
            "お疲れさまでした＾＾";

          document.getElementById("explanation").style.display =
            "none";

          document.getElementById("nextButton").style.display =
            "none";
        }
      };

    showQuestion();
  </script>

</body>
</html>
