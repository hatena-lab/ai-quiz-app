<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI基礎テスト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="quiz-container">
    <h1>AI基礎テスト</h1>

    <div id="progress"></div>

    <section id="quiz">
      <h2 id="question"></h2>
      <div id="choices"></div>
      <div id="result"></div>
      <button id="nextButton" class="hidden">次の問題へ</button>
    </section>

    <section id="scoreScreen" class="hidden">
      <h2>テスト終了！</h2>
      <p id="score"></p>
      <button id="restartButton">もう一度挑戦する</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
